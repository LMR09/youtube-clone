<!DOCTYPE html>
<html>
  <head>
    <title>Practice</title>
    <style>
  .a {
    background-color: yellow;
    color: black;
    border: none;
    border-radius: 16px;
    height: 36px;
    width: 100px;
    font-size: medium;
    margin-right: 10px;
    cursor: pointer;
    transition: box-shadow 0.15s;

  }
  .a:active{
    box-shadow: 5px 5px 10px rgba(0,0,0,0.15);
  }
  .a:hover {
    opacity: 0.8;
  }
  .b {
    background-color: rgb(255, 153, 0);
    color: white;
    border: none;
    border-radius: 16px;
    height: 36px;
    width: 100px;
    font-size: medium;
    margin-right: 10px;
    cursor: pointer;
    transition: box-shadow 0.15s;

  }
  .b:active{
    box-shadow: 5px 5px 10px rgba(0,0,0,0.15);
  }
  .b:hover {
    opacity: 0.8;
  }
  #p1{
    color: rgb(11, 241, 11);
  }
  a{
    transition: box-shadow 0.15s;
  }
  .r{
    font-size: 30px;
    margin-top: 100px;
    font-family: Arial, Helvetica, sans-serif;
  }
  .pickup{
    display: block;
    margin-top: 1px;
    margin-bottom: 10px;
    border: none;
    background-color: rgb(237, 234, 234);
    padding-top: 10px;
    padding-bottom: 10px;
    padding-left: 15px;
    padding-right: 120px;
  }
  .destination{
    background-color: rgb(237, 234, 234);
    border: none;
    padding-top: 10px;
    padding-bottom: 10px;
    padding-left: 15px;
    padding-right: 120px;
    display: block;
    margin-bottom: 30px;
 }
  .req{
    background-color: black;
    color: white;
    padding-top: 15px;
    padding-bottom: 15px;
    padding-left: 20px;
    padding-right: 20px;
    border: none;
  }
  .s{
    background-color: rgb(237, 234, 234);
    color: black;
    border: none;
    padding-left: 20px;
    padding-right: 20px;
    padding-top: 15px;
    padding-bottom: 15px;
    margin-left: 10px;
  }
  </style>
  </head>
  <body>


<a href="www.amazon.com">Back to amazon</a>
<h1>Nike Black Running Shoes</h1>
<p id="p1">$39. In Stock</p>
<h3>Free Delivery Tommorrow</h3>
<button class="a">Add to Cart</button>
<button class="b">Buy Now</button>
<p class="r">Request a ride now</p>
<input class="pickup" type="text" placeholder="Enter Pickup Location"> 
<input class="destination" type="text" placeholder="Enter Destination">
<button class="req">Request now </button>
<button class="s">Schedule for later</button>

  </body>
</html>
