<!DOCTYPE html>
<html>
  <head>
    <title>Grid Practice</title>
  </head>
  <body padding-bottom: 1000px;>
    <!-- First grid -->
    <div style="
      display: grid;
      grid-template-columns: 200px 200px;
    ">
      <div style="background-color: grey;">div 1</div>
      <div style="background-color: lightpink;">
        div 2
        <p>Text</p>
      </div>
    </div>

    <!-- Second grid -->
    <div style="
      margin-top: 20px;
      display: grid;
      grid-template-columns: 100px 100px 200px;
    ">
      <div style="background-color: grey;">100px</div>
      <div style="background-color: pink;">
        100px
        <p>Text</p>
      </div>
      <div style="background-color: lightblue;">200px</div>
      <div style="background-color: lightgreen;">100px</div>
    </div>

    <!-- Third grid -->
    <div style="
      margin-top: 20px;
      display: grid;
      grid-template-columns: 100px 1fr;
    ">
      <div style="background-color: grey;">100</div>
      <div style="background-color: pink;">1fr</div>
    </div>

    <!-- Fourth grid -->
    <div style="
      margin-top: 20px;
      display: grid;
      grid-template-columns: 100px 1fr 2fr;
    ">
      <div style="background-color: grey;">100</div>
      <div style="background-color: pink;">1fr</div>
      <div style="background-color: grey;">2fr</div>
    </div>
    <!-- fifth grid -->
         <div style="
      margin-top: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      column-gap: 20px;
      row-gap: 40px;
    ">
      <div style="background-color: lightblue; height: 200px;">1fr</div>
      <div style="background-color: pink; height: 200px;">1fr</div>
      <div style="background-color: lightblue; height: 200px;">1fr</div>
      <div style="background-color: pink; height: 200px;">1fr</div>
      <div style="background-color: lightblue; height: 200px;">1fr</div>
      <div style="background-color: pink; height: 200px;">1fr</div>
    </div>
  </body>
</html>
